name: Mirror Bitbucket Branch

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows you to run it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history so we can merge properly

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Add Bitbucket Remote and Fetch
        env:
          BB_USER: ${{ secrets.BITBUCKET_USERNAME }}
          BB_PASS: ${{ secrets.BITBUCKET_PASSWORD }}
          # Added .git to the end here
          BB_REPO: bitbucket.org/rcupec/rvl.git
          TARGET_BRANCH: simundic-linux
        run: |
          # 1. Add Bitbucket as a remote using the secrets for auth
          git remote add bitbucket https://$BB_USER:$BB_PASS@$BB_REPO
          
          # 2. Fetch all branches from Bitbucket so the remote references are created
          git fetch bitbucket

          # 3. Reset your current local branch to match Bitbucket exactly
          git checkout -B $TARGET_BRANCH bitbucket/$TARGET_BRANCH

          # 4. Push the updated branch to GitHub
          git push origin $TARGET_BRANCH --force
