name: Mirror Bitbucket Branch

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-bitbucket-simundic-linux
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Bitbucket Remote and Fetch
        env:
          BB_USER: ${{ secrets.BITBUCKET_USERNAME }}
          BB_PASS: ${{ secrets.BITBUCKET_PASSWORD }}
          BB_REPO: bitbucket.org/rcupec/rvl.git
          TARGET_BRANCH: simundic-linux
        run: |
          set -euo pipefail

          git remote remove bitbucket 2>/dev/null || true
          git remote add bitbucket "https://${BB_USER}:${BB_PASS}@${BB_REPO}"

          git fetch --no-tags --prune bitbucket "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "bitbucket/${TARGET_BRANCH}"
          git push --force origin "${TARGET_BRANCH}"
